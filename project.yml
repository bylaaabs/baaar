name: baaar

options:
  bundleIdPrefix: com.laaabs
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

# the look (colours, fonts, controls, menus, windows) and the marks come from the kit, shared by
# every laaabs. app. pinned to an exact revision; bump it on purpose.
packages:
  LaaabsKit:
    url: https://github.com/bylaaabs/ui-swift
    revision: 094de0f9ecd14c28edd3ccd9f44d7dd14246146f

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3862GT8D5W
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # English is the source language; Spanish ships from day one (baaar/Resources/Localizable.xcstrings).
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  baaar:
    type: application
    platform: macOS
    sources:
      # Swift, baaar/Assets.xcassets and baaar/Resources (string catalogs). the fonts and the
      # mark come from the kit.
      - path: baaar
      # Icon Composer app icon (Liquid Glass). actool compiles the .icon bundle
      # named by ASSETCATALOG_COMPILER_APPICON_NAME (basename: baaar).
      - path: design/icon/baaar.icon
        type: file
    dependencies:
      - package: LaaabsKit
        product: LaaabsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laaabs.baaar
        PRODUCT_NAME: baaar
        ASSETCATALOG_COMPILER_APPICON_NAME: baaar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: baaar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 laaabs."
