# Builds, signs, notarizes and publishes baaar when a release tag is pushed.
#
#   git tag -s v0.4.0-alpha.1 -m "baaar 0.4.0-alpha.1"
#   git push origin v0.4.0-alpha.1
#
# Runs the same scripts a maintainer runs locally (scripts/release/*), so the
# two paths cannot drift. Docs: docs/RELEASING.md.
#
# Secrets (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_CERT_P12_BASE64     Developer ID Application certificate, .p12, base64
#   DEVELOPER_ID_CERT_PASSWORD       its password
#   DEVELOPER_ID_APPLICATION         optional: the exact identity name, when the
#                                    keychain holds more than one Developer ID
#   APPSTORE_CONNECT_API_KEY_BASE64  App Store Connect API key (.p8), base64
#   APPSTORE_CONNECT_API_KEY_ID      its 10 character key id
#   APPSTORE_CONNECT_API_ISSUER_ID   the issuer UUID
# Variables:
#   XCODE_APP                        optional: /Applications/Xcode_27.0.app to pin an Xcode
#
# Without the certificate the build fails on purpose: an unsigned baaar would
# not open on anyone's Mac. Without the API key the release is published
# signed but not notarized, and the job says so.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and publish
    # GitHub has no macos-27 image yet (September 2026). macos-26 ships Xcode 26,
    # which builds baaar; the xcode-27 preview label (macOS 26 + Xcode 27 beta)
    # is the fallback if the macOS 27 SDK becomes a hard requirement. Move to
    # macos-27 when it appears in github.com/actions/runner-images.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi
          PROJECT_VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' project.yml | head -1)"
          if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
            echo "::error::project.yml has MARKETING_VERSION $PROJECT_VERSION but the tag is $TAG. Bump project.yml before tagging."
            exit 1
          fi

      - name: Select Xcode
        env:
          XCODE_APP: ${{ vars.XCODE_APP }}
        run: |
          if [[ -n "$XCODE_APP" ]]; then sudo xcode-select -s "$XCODE_APP"; fi
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install --quiet xcodegen

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          if [[ -z "$DEVELOPER_ID_CERT_P12_BASE64" ]]; then
            echo "::error::DEVELOPER_ID_CERT_P12_BASE64 is not set; a release must be signed with Developer ID"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Keep the login keychain in the search list next to the new one.
          KEYCHAINS=()
          while IFS= read -r line; do
            KEYCHAINS+=("$(printf '%s' "$line" | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${KEYCHAINS[@]}"
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          # The scripts sign with the identity's full name.
          if [[ -z "$DEVELOPER_ID_APPLICATION" ]]; then
            DEVELOPER_ID_APPLICATION="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          fi
          if [[ -z "$DEVELOPER_ID_APPLICATION" ]]; then
            echo "::error::the imported certificate is not a Developer ID Application identity"
            exit 1
          fi
          echo "Signing as $DEVELOPER_ID_APPLICATION"
          echo "DEVELOPER_ID_APPLICATION=$DEVELOPER_ID_APPLICATION" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [[ -z "$APPSTORE_CONNECT_API_KEY_BASE64" || -z "$APPSTORE_CONNECT_API_KEY_ID" || -z "$APPSTORE_CONNECT_API_ISSUER_ID" ]]; then
            echo "::warning::App Store Connect API key secrets are not set; the release will be signed but not notarized"
            echo "NOTARIZE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$APPSTORE_CONNECT_API_KEY_ID.p8"
          echo "$APPSTORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          {
            echo "NOTARIZE=1"
            echo "APPSTORE_CONNECT_API_KEY_PATH=$KEY_PATH"
            echo "APPSTORE_CONNECT_API_KEY_ID=$APPSTORE_CONNECT_API_KEY_ID"
            echo "APPSTORE_CONNECT_API_ISSUER_ID=$APPSTORE_CONNECT_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build and sign baaar.app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/release/build-release.sh

      - name: Notarize and staple baaar.app
        if: env.NOTARIZE == '1'
        run: scripts/release/notarize.sh dist/baaar.app

      - name: Make the DMG and the zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/release/make-dmg.sh dist/baaar.app

      - name: Notarize and staple the DMG
        if: env.NOTARIZE == '1'
        run: scripts/release/notarize.sh "dist/baaar-v${{ steps.ver.outputs.version }}.dmg"

      - name: Checksums and cask
        run: |
          scripts/release/checksum.sh "${{ steps.ver.outputs.version }}" | tee dist/checksums.txt
          {
            echo "## baaar ${{ steps.ver.outputs.version }}"
            echo
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { inside = ($0 ~ "^## \\[v?" v "\\]") ; next }
            inside { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [[ ! -s dist/release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [v$VERSION]; rename [Unreleased] before tagging"
            exit 1
          fi
          {
            echo
            echo "### SHA-256"
            echo
            echo '```'
            (cd dist && shasum -a 256 "baaar-v$VERSION.dmg" "baaar-v$VERSION.zip")
            echo '```'
          } >> dist/release-notes.md
          if [[ "${NOTARIZE:-0}" != "1" ]]; then
            printf '\nThis build is signed but not notarized.\n' >> dist/release-notes.md
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # A maintainer who released from their Mac with scripts/release/release.sh
          # already created this release; do not replace their notarized files.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists; leaving it untouched"
            exit 0
          fi
          gh release create "$TAG" \
            "dist/baaar-v$VERSION.dmg" \
            "dist/baaar-v$VERSION.zip" \
            --verify-tag \
            --title "baaar $VERSION" \
            --notes-file dist/release-notes.md \
            ${{ steps.ver.outputs.prerelease }}

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/cert.p12"
