# Applies exactly one `size:` label to a pull request, counting effective
# changed lines. Tests, generated projects, asset catalogs and design files do
# not count: a pull request is not large because it came with the tests it
# should have.
#
# Thresholds are documented in CONTRIBUTING.md and must match it.
name: PR size

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply size label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const SIZES = [
              { label: 'size: XS', max: 9 },
              { label: 'size: S',  max: 49 },
              { label: 'size: M',  max: 199 },
              { label: 'size: L',  max: 599 },
              { label: 'size: XL', max: Infinity },
            ];

            // Excluded from the count. Tests are excluded on purpose: adding
            // them should never make a pull request look bigger than it is.
            const EXCLUDE = [
              /(^|\/)tests?\//i,
              /Tests?\.swift$/,
              /(^|\/)Package\.resolved$/,
              // Generated by xcodegen from project.yml.
              /\.xcodeproj\//,
              /\.pbxproj$/,
              // Asset catalogs, the Icon Composer bundle and design canvases
              // are mostly machine-written JSON and binary files.
              /\.xcassets\//,
              /\.icon\//,
              /\.pen$/,
              /\.(png|jpe?g|pdf|ttf|otf)$/i,
            ];

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: number, per_page: 100 },
            );

            let effective = 0, skipped = 0;
            for (const f of files) {
              if (EXCLUDE.some((re) => re.test(f.filename))) { skipped++; continue; }
              effective += (f.additions ?? 0) + (f.deletions ?? 0);
            }

            const wanted = SIZES.find((s) => effective <= s.max).label;

            const current = context.payload.pull_request.labels.map((l) => l.name);
            const stale = current.filter((n) => n.startsWith('size: ') && n !== wanted);
            for (const name of stale) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name })
                .catch(() => {});
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: number, labels: [wanted],
              });
            }

            core.info(`${effective} effective lines across ${files.length - skipped} files ` +
                      `(${skipped} excluded) -> ${wanted}`);
            if (wanted === 'size: XL') {
              core.warning('This pull request is XL. CONTRIBUTING says split it before starting; ' +
                           'if it is already written, consider splitting it before review.');
            }
